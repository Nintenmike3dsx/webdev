<div class="container-fluid px-4 py-4">
  <h2 class="text-center mb-4 text-white">Submitted Recipes</h2>
  <!-- uses a different id than #recipe-grid so recipes.js doesn't overwrite it -->
  <div class="row" id="submitted-grid"></div>
</div>

<footer class="d-flex justify-content-center align-items-center py-2 header-bar">
    <a href="https://github.com/Nintenmike3dsx/webdev/tree/clientFinal" class="btn btn-outline-light btn-sm" style="color: white;" target="_blank">Visit Github</a>
</footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const grid = document.getElementById('submitted-grid');
  const recipes = JSON.parse(localStorage.getItem('submittedRecipes') || '[]');

  if (recipes.length === 0) {
    grid.innerHTML = '<p class="text-center w-100 mt-4 text-white"><b>No recipes submitted yet. <a href="index.html">Submit one!</a></b></p>';
    return;
  }

  recipes.forEach(recipe => {
    const col = document.createElement('div');
    col.className = 'col-6 col-md-3 mb-4 fade-in';
    const favorited = isFavorite(recipe.id);

    // Same card structure as recipes.js — image falls back to a placeholder div if none was uploaded
    const imgHtml = recipe.imageDataUrl
      ? `<img src="${recipe.imageDataUrl}" class="card-img-top" style="height:180px;object-fit:cover;">`
      : `<div class="card-img-top bg-secondary d-flex align-items-center justify-content-center" style="height:180px;"><span class="text-white">No Image</span></div>`;

    col.innerHTML = `
      <div class="card h-100" style="cursor:pointer;">
        <div style="position:relative;">
          ${imgHtml}
          </button>
          <button class="delete-btn" data-id="${recipe.id}" style="position:absolute;top:6px;left:8px;background:none;border:none;padding:0;cursor:pointer;line-height:1;">
            <span class="material-icons" style="font-size:26px;color:rgba(255,255,255,0.8);text-shadow:0 1px 3px rgba(0,0,0,0.6);">delete</span>
          </button>
        </div>
        <div class="card-body bg-dark text-white">
          <h6 class="card-title fw-bold text-center">${recipe.name}</h6>
        </div>
      </div>`;

    col.addEventListener('click', () => {
      localStorage.setItem('selectedRecipe', JSON.stringify(recipe));
      window.location.href = 'submission_display.html';
    });

    col.querySelector('.delete-btn').addEventListener('click', e => {
      e.stopPropagation();
      const all = JSON.parse(localStorage.getItem('submittedRecipes') || '[]');
      localStorage.setItem('submittedRecipes', JSON.stringify(all.filter(r => r.id !== recipe.id)));
      col.remove();
    });
    grid.appendChild(col);
  });
});
</script>

</body>
